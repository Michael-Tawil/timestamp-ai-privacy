<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TimeStamp AI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="popup">
    <div class="header">
      <span class="logo">⏱ TimeStamp AI</span>
      <label class="toggle">
        <input type="checkbox" id="toggleEnabled" />
        <span class="track">
          <span class="thumb"></span>
        </span>
      </label>
    </div>
    <div class="status" id="statusText">Active</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
